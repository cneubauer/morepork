syntax = "proto2";

option java_package = "com.oneandone.hosting.infrastructure.stackableapps.protobuf";
option java_outer_classname = "StateHeaderMessages";

message StateHeader {
    enum Namespace {
        PROXY                = 1;  // webshield
        PRODUCT_DNS          = 2;  // for all companies available
        SHARED_WEBSPACE      = 3;  // linux and windows webspaces
        DATABASE             = 4;  // mysql, mssql, mariadb
        REDIRECT             = 5;
        REDIRECT_CONFIG      = 6;  // is not used
        PROXY_CONFIG         = 7;  // is not used
        PRODUCT_DOMAINS_DB   = 8;  // GPHWAAS-4363: namespace for database product domains (replacement for PRODUCT_DNS)
        PRODUCT_DOMAINS_WS   = 9;  // GPHWAAS-4363: namespace for webspace product domains (replacement for PRODUCT_DNS)
        STRETCH_SPACE        = 10; // GPHWAAS-8678: stretch space resources
    }

    enum Zone {
        DE = 1;
        US = 2;
        ES = 3;
        UK = 4;
        MM = 5; // a temporary zone for Mail & Media
        GLOBALCDN = 6;
    }

    //global unique compound key
    required uint64 stackInstanceId   = 1;
    required Namespace stateNamespace = 2;
    required Zone stateZone           = 3;
    required uint64 stateVersion      = 4;
    optional uint64 systemInstanceId  = 7; // e.g. by spaces it is the webspace id generated by the Planner

    //propagate nonexistence of a state
    required bool isTombstone         = 5;

    //meta tag for isolation
    //optional Tenant tenant          = 6; Deprecated: replaced by string tenant name property for easier handling
    optional string tenantName        = 8;

    repeated string tags              = 9; // optional list of stack instance tags
}


message StateHeaderHtmlTemplate {
    enum Zone {
        DE = 1;
        US = 2;
        ES = 3;
        UK = 4;
        MM = 5; // a temporary zone for Mail & Media
        GLOBALCDN = 6;
    }

    required Zone stateZone           = 1;
    required uint64 stateVersion      = 2;

    //propagate nonexistence of a state
    required bool isTombstone         = 3;
    optional string tenantName        = 4;

    required string templateName      = 5;
    optional string referenceId       = 6;
}