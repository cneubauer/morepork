services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - ./sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready"]
      interval: 5s
      timeout: 5s
      retries: 10

  temporal:
    image: temporalio/auto-setup
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PWD: ${POSTGRES_PASSWORD}
      POSTGRES_SEEDS: postgres
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development.yaml
    ports:
      - "7233:7233"
    volumes:
      - ./dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    # auto-setup creates databases and runs schema migrations before the frontend
    # binds 7233. Without this, dependents connect into that window and get refused.
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "temporal:7233"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s

  temporal-ui:
    image: temporalio/ui
    depends_on:
      - temporal
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports:
      - "8080:8080"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_running"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  webspace-middleware-mock:
    build:
      context: ./mocks/webspace-middleware
    # No shell in the image beyond BusyBox and no curl, so probe with node itself.
    healthcheck:
      test: ["CMD", "node", "-e", "require('node:http').get('http://127.0.0.1:8081/_mock/webspaces', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 5

  space-classic-worker:
    build:
      context: .
      dockerfile: src/Systems/Space/Classic/WaaS.Space.Classic.Worker/Dockerfile
    environment:
      ConnectionStrings__WaaS: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Temporal__TargetHost: "temporal:7233"
      WebspaceMiddleware__BaseUrl: "http://webspace-middleware-mock:8081/"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      webspace-middleware-mock:
        condition: service_healthy
    restart: on-failure

  webshield-worker:
    build:
      context: .
      dockerfile: src/Systems/Webshield/WaaS.Webshield.Worker/Dockerfile
    environment:
      ConnectionStrings__WaaS: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ConnectionStrings__RabbitMq: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/"
      Temporal__TargetHost: "temporal:7233"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: on-failure

  waas-api:
    build:
      context: .
      dockerfile: src/WaaS.WebApi/Dockerfile
    environment:
      ConnectionStrings__WaaS: "Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      Temporal__TargetHost: "temporal:7233"
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
    restart: on-failure
