apiVersion: v2
name: waas
description: WaaS Manager — API and Temporal workers
type: application
version: 0.1.0        # chart version, bumped on template changes
appVersion: "1.4.0"   # default image tag, overridable per release

# Helm can pull the infrastructure in as subcharts, so one `helm install` brings
# up Temporal and RabbitMQ too. Kustomize has no equivalent — there you install
# those charts separately and Kustomize only owns the first-party manifests.
#
# Left commented so this chart renders standalone. Note the friction if you enable
# it: Helm refuses to render at all until the dependencies are vendored into
# charts/ via `helm dependency build`, even when both conditions are false. That
# means a network fetch and either a committed charts/ directory or a build step
# in CI before `helm template` works at all.
#
# dependencies:
#   - name: temporal
#     version: 0.62.0
#     repository: https://go.temporal.io/helm-charts
#     condition: temporal.enabled
#   - name: rabbitmq
#     version: 15.5.5
#     repository: https://charts.bitnami.com/bitnami
#     condition: rabbitmq.enabled
