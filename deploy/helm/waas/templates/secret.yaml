{{- if .Values.secret.create -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ default .Values.secretName .Values.secret.name }}
  labels:
    {{- include "waas.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secret.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end -}}
