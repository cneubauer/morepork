apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "waas.fullname" . }}-test-connection"
  labels:
    {{- include "waas.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "waas.fullname" . }}-api:80']
  restartPolicy: Never
