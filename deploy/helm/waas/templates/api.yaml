apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "waas.fullname" . }}-api
  labels:
    {{- include "waas.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "waas.name" . }}-api
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "waas.labels" . | nindent 8 }}
        app.kubernetes.io/name: {{ include "waas.name" . }}-api
        app.kubernetes.io/component: api
    spec:
      serviceAccountName: {{ include "waas.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        {{- include "waas.waitForTemporal" . | nindent 8 }}
      containers:
        - name: api
          image: "{{ .Values.image.registry }}/waas-api:{{ include "waas.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: Temporal__TargetHost
              value: {{ include "waas.temporalAddress" . }}
            {{- range $key, $value := .Values.api.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          # AddKeyPerFile("/run/secrets") in Program.cs reads each file as a config
          # key, so no env wiring is needed for the connection string here.
          volumeMounts:
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
          # Depends on AddHealthChecks()/MapHealthChecks(), which Program.cs does
          # not have yet. Until it does, the pod will never report ready.
          livenessProbe:
            httpGet: { path: /health/live, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: { path: /health/ready, port: http }
            initialDelaySeconds: 5
            periodSeconds: 5
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext: {{- include "waas.securityContext" . | nindent 12 }}
      volumes:
        - name: secrets
          secret:
            secretName: {{ default .Values.secretName .Values.secret.name }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "waas.fullname" . }}-api
  labels:
    {{- include "waas.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  selector:
    app.kubernetes.io/name: {{ include "waas.name" . }}-api
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.api.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "waas.fullname" . }}-api
  labels:
    {{- include "waas.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  ingressClassName: {{ .Values.api.ingress.className }}
  rules:
    - host: {{ .Values.api.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "waas.fullname" . }}-api
                port:
                  name: http
{{- end }}

